# ⚠️ 重要：/api/trigger-cron 自 v3.4.0 起需要 Basic Auth
# 請確保 gooaye-secrets 中已加入：
#   INTERNAL_AUTH_USER=<帳號>
#   INTERNAL_AUTH_PASS=<密碼>
# curl 的 -u 參數會從 Secret 注入的環境變數讀取

# 股癌 (Gooaye) 的 CronJob — 每天晚上 21:00
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gooaye-summary-cron
spec:
  schedule: "0 21 * * *"
  timeZone: "Asia/Taipei"
  concurrencyPolicy: Forbid      # 防止上一個 Job 還沒跑完就觸發下一個
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            cloud.google.com/gke-spot: "true"
          tolerations:
          - key: "cloud.google.com/gke-spot"
            operator: "Equal"
            value: "true"
            effect: "NoSchedule"
          containers:
          - name: trigger-cron
            image: curlimages/curl:latest
            imagePullPolicy: IfNotPresent
            env:
            - name: AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: gooaye-secrets
                  key: INTERNAL_AUTH_USER
            - name: AUTH_PASS
              valueFrom:
                secretKeyRef:
                  name: gooaye-secrets
                  key: INTERNAL_AUTH_PASS
            command:
            - /bin/sh
            - -c
            - |
              curl -f -X POST http://gooaye-summary-service:80/api/trigger-cron \
                -u "${AUTH_USER}:${AUTH_PASS}" \
                -H "Content-Type: application/json" \
                -d '{"channelId": "gooaye_videos"}' \
                && echo "✅ gooaye_videos triggered" \
                || echo "❌ Failed to trigger gooaye_videos"
          restartPolicy: OnFailure

