apiVersion: apps/v1
kind: Deployment
metadata:
  name: gooaye-summary-app
  labels:
    app: gooaye-summary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gooaye-summary
  template:
    metadata:
      labels:
        app: gooaye-summary
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      tolerations:
      - key: "cloud.google.com/gke-spot"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      containers:
      - name: gooaye-summary
        image: r76021061/gooaye-summary:VERSION_PLACEHOLDER
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"       # 允許短暫爆發（yt-dlp + ffmpeg CPU 密集）
            memory: "1536Mi"   # 1.5 GB：音檔 base64 轉換 + Gemini 回應可能較大
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: gooaye-summary-config
        - secretRef:
            name: gooaye-secrets
        volumeMounts:
        - name: cache-volume
          mountPath: /app/cache   # yt-dlp 音檔暫存目錄（下載完立即刪除）
        - name: firebase-config-volume
          mountPath: /app/firebase-applet-config.json
          subPath: firebase-applet-config.json
          readOnly: true
      volumes:
      - name: cache-volume
        persistentVolumeClaim:
          claimName: gooaye-summary-pvc
      - name: firebase-config-volume
        secret:
          secretName: firebase-config-secret
